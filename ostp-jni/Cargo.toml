[package]
name = "ostp-jni"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "JNI bindings of the OSTP client for the Android app"
repository = "https://github.com/ospab/ostp"

[lib]
name = "ostp_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
tokio = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
ostp-core = { path = "../ostp-core" }
ostp-client = { path = "../ostp-client" }
ostp-ssh = { path = "../ostp-ssh" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-atomic = { workspace = true }
tracing-subscriber = "0.3.23"
tracing.workspace = true
